<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="1200" height="240" fill="none">
  <defs>
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="35%" stop-color="#0b1329" />
      <stop offset="70%" stop-color="#062726" />
      <stop offset="100%" stop-color="#021419" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="40%" stop-color="#00ff87" />
      <stop offset="80%" stop-color="#60efff" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00ff87" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>
    <filter id="neon" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="1200" height="240" rx="14" fill="url(#headerGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Grid overlay -->
  <g opacity="0.07" stroke="#00ff87" stroke-width="1">
    <path d="M0 40 H1200 M0 80 H1200 M0 120 H1200 M0 160 H1200 M0 200 H1200" />
    <path d="M60 0 V240 M120 0 V240 M180 0 V240 M240 0 V240 M300 0 V240 M360 0 V240 M420 0 V240 M480 0 V240 M540 0 V240 M600 0 V240 M660 0 V240 M720 0 V240 M780 0 V240 M840 0 V240 M900 0 V240 M960 0 V240 M1020 0 V240 M1080 0 V240 M1140 0 V240" />
  </g>

  <!-- Ambient light blobs -->
  <circle cx="200" cy="120" r="140" fill="#00ff87" opacity="0.08" filter="url(#neon)" />
  <circle cx="1000" cy="120" r="140" fill="#38bdf8" opacity="0.08" filter="url(#neon)" />

  <!-- Decorative Corner Brackets -->
  <path d="M20 45 V20 H45" stroke="#00ff87" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M1180 45 V20 H1155" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M20 195 V220 H45" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.8" />
  <path d="M1180 195 V220 H1155" stroke="#00ff87" stroke-width="2" fill="none" opacity="0.8" />

  <!-- Terminal Status Pill -->
  <g transform="translate(480, 32)">
    <rect width="240" height="26" rx="13" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="20" cy="13" r="4.5" fill="#00ff87">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="17" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1">SYSTEM NODE // ONLINE</text>
  </g>

  <!-- Main Name Title -->
  <text x="600" y="122" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="52" font-weight="900" text-anchor="middle" letter-spacing="4" filter="url(#neon)">YASHWANT RAJ</text>

  <!-- Subtitle -->
  <text x="600" y="162" fill="#94a3b8" font-family="'JetBrains Mono', Consolas, monospace" font-size="14.5" font-weight="600" text-anchor="middle" letter-spacing="3">SYSTEMS SOFTWARE &amp; CYBERSECURITY RESEARCHER</text>

  <!-- Badges / Metadata row -->
  <text x="600" y="196" fill="#00ff87" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="500" text-anchor="middle" letter-spacing="1.5">VIT BHOPAL UNIVERSITY ('28) • B.TECH CYBERSECURITY &amp; FORENSICS</text>
</svg>
